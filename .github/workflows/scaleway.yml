name: Deploy to Scaleway Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Scaleway secrets configured
        id: check
        run: |
          if [ -z "${{ secrets.SCW_SECRET_KEY }}" ] || [ -z "${{ secrets.SCW_REGISTRY_ENDPOINT }}" ]; then
            echo "SCW secrets not set — skip build/push (configure SCW_SECRET_KEY + SCW_REGISTRY_ENDPOINT in Settings→Secrets to enable auto-deploy)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Scaleway Container Registry
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.SCW_REGISTRY_ENDPOINT }}/freebuff-proxy:latest
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Scaleway Container (v1 auto-deploy)
        if: steps.check.outputs.skip == 'false'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
          SCW_REGION: ${{ secrets.SCW_REGION }}
          SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
        run: |
          set -e
          # Derive region from registry host if SCW_REGION not set (pl-waw example from user)
          if [ -z "$SCW_REGION" ]; then
            HOST=$(echo "$SCW_REGISTRY_ENDPOINT" | cut -d/ -f1)
            case "$HOST" in
              rg.pl-waw.scw.cloud) REGION="pl-waw" ;;
              rg.nl-ams.scw.cloud) REGION="nl-ams" ;;
              rg.fr-par.scw.cloud) REGION="fr-par" ;;
              *) REGION="fr-par" ;;
            esac
            echo "SCW_REGION not set, derived REGION=$REGION from $HOST"
          else
            REGION="$SCW_REGION"
          fi
          IMAGE="${SCW_REGISTRY_ENDPOINT}/freebuff-proxy:latest"
          if [ -z "$SCW_CONTAINER_ID" ]; then
            echo "Image pushed to $IMAGE — create container first in console (Deploy a Container), then add SCW_CONTAINER_ID to Secrets for auto-redeploy."
            exit 0
          fi
          echo "Updating container $SCW_CONTAINER_ID to $IMAGE in $REGION ..."
          # v1 API: PATCH auto-deploys on update. Still call /redeploy for mutable tag.
          curl -fsS -X PATCH "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${SCW_CONTAINER_ID}" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"registry_image\": \"${IMAGE}\"}" \
            | head -c 500
          echo
          echo "Patch OK, triggering redeploy for mutable tag..."
          sleep 3
          curl -fsS -X POST "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${SCW_CONTAINER_ID}/redeploy" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' | head -c 500 || echo "redeploy optional (v1 auto-deploy), ignore error"
          echo
          echo "Done. Console: https://console.scaleway.com/containers/containers/${REGION}/${SCW_CONTAINER_ID}/overview"

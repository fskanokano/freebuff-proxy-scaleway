name: Deploy to Scaleway Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.SCW_REGISTRY_ENDPOINT }}/freebuff-proxy:latest
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Scaleway Container (v1 auto-deploy)
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
          SCW_REGION: ${{ secrets.SCW_REGION }}
          SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
        run: |
          set -e
          REGION="${SCW_REGION:-fr-par}"
          IMAGE="${SCW_REGISTRY_ENDPOINT}/freebuff-proxy:latest"
          if [ -z "$SCW_CONTAINER_ID" ] || [ -z "$SCW_REGISTRY_ENDPOINT" ]; then
            echo "Missing SCW_CONTAINER_ID or SCW_REGISTRY_ENDPOINT secret. Skipping redeploy (image pushed only)."
            echo "Create container first in console, then add its ID to GitHub Secrets."
            exit 0
          fi
          echo "Updating container $SCW_CONTAINER_ID to $IMAGE in $REGION ..."
          # v1 API: PATCH auto-deploys on update. Still call /redeploy for mutable tag.
          curl -fsS -X PATCH "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${SCW_CONTAINER_ID}" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"registry_image\": \"${IMAGE}\"}" \
            | head -c 500
          echo
          echo "Patch OK, triggering redeploy for mutable tag..."
          sleep 3
          curl -fsS -X POST "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${SCW_CONTAINER_ID}/redeploy" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' | head -c 500 || echo "redeploy optional (v1 auto-deploy), ignore error"
          echo
          echo "Done. Console: https://console.scaleway.com/containers/containers/${REGION}/${SCW_CONTAINER_ID}/overview"
